name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # PLACEHOLDER: the first Conn3x release with windows_iis_app_pool and
  # windows_iis_site, such as v0.7.0. Set it before this repository is
  # published; until then every job fails at the install step on purpose.
  CONN3X_VERSION: vX.Y.Z-first-release-with-iis

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$CONN3X_VERSION"
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/azure
        run: conn3x init -backend=false && conn3x validate

  # The Linux circuits test on four distributions in containers. Windows
  # can't run in one, so this applies the circuit to the runner itself, over
  # loopback OpenSSH, the way Conn3x's own windows-host job does. Conn3x
  # releases have no Windows binary yet, so it's built from the same tag.
  e2e:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    name: e2e (windows-2025)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: ${{ env.CONN3X_VERSION }}
          path: conn3x
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conn3x/go.mod
          cache: false
      - name: Build Conn3x
        shell: pwsh
        run: |
          go -C conn3x build -o "$env:RUNNER_TEMP\bin\conn3x.exe" ./cmd/conn3x
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\bin"
      - name: Start sshd with a throwaway login key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
          }
          $d = 'C:\ProgramData\ssh'
          New-Item -ItemType Directory -Force $d | Out-Null
          $work = "$env:RUNNER_TEMP\win"
          New-Item -ItemType Directory -Force $work | Out-Null
          & "$env:WINDIR\System32\OpenSSH\ssh-keygen.exe" -q -t ed25519 -N '' -f "$work\admin"
          if ($LASTEXITCODE) { throw 'login key' }
          Remove-Item "$d\ssh_host_*" -Force -ErrorAction SilentlyContinue
          Copy-Item "$work\admin.pub" "$d\administrators_authorized_keys"
          & icacls.exe "$d\administrators_authorized_keys" /inheritance:r /grant '*S-1-5-18:F' /grant '*S-1-5-32-544:F' | Out-Null
          if ($LASTEXITCODE) { throw 'icacls' }
          Set-Service sshd -StartupType Manual
          # With no host keys left, sshd makes its own as it starts.
          Restart-Service sshd
          $hk = (Get-Content "$d\ssh_host_ed25519_key.pub" -Raw).Trim()
          $key = "$work\admin" -replace '\\', '/'
          Set-Content test\ci.auto.tfvars "user     = `"$env:USERNAME`"`nkey_file = `"$key`"`nhost_key = `"$hk`""
      - name: Apply, check the page, plan again with no changes
        shell: pwsh
        working-directory: test
        run: |
          conn3x init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conn3x apply -auto-approve
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $r = Invoke-WebRequest -UseBasicParsing -Headers @{ Host = 'circuit-iis.test' } http://127.0.0.1/
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'circuit-iis test page') { throw "page: $($r.StatusCode) $($r.Content)" }
          conn3x plan -detailed-exitcode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
